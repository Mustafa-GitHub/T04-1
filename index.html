<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>T04 – SVG House &amp; Garden</title>
	<style>
		body {
			margin: 0;
			padding: 2rem;
			background: #f3f6f2;
			color: #24332b;
			font-family: Georgia, "Times New Roman", serif;
		}

		main {
			max-width: 800px;
			margin: 0 auto;
		}

		h1 {
			margin: 0 0 1rem;
			font-size: 1.6rem;
			font-weight: 600;
		}

		svg {
			display: block;
			width: 100%;
			height: auto;
			border: 2px solid #496452;
			background: #d9eff5;
		}

		figure {
			margin: 0 0 1.5rem;
		}

		figcaption {
			margin-bottom: 0.5rem;
			font-weight: 600;
		}

		#scene-annotated #annotations {
			font-size: 12px;
			fill: #333;
			stroke: #999;
			stroke-width: 1;
		}

		#scene-annotated #annotations text {
			stroke: none;
			pointer-events: none;
		}

		#scene-annotated #annotations line {
			pointer-events: none;
		}

		/* Stronger outlines and a darker roof and lawn improve contrast. */
		#scene-adjusted .ground {
			fill: #6f9d58;
		}

		#scene-adjusted .house-body {
			fill: #f6d68f;
			stroke: #503d2d;
			stroke-width: 4;
		}

		#scene-adjusted .roof {
			fill: #a13f35;
			stroke: #612f29;
			stroke-width: 5;
		}

		#scene-adjusted .chimney {
			stroke: #612f29;
			stroke-width: 4;
		}

		#scene-adjusted .window-frame,
		#scene-adjusted .window-divider {
			stroke: #493a2e;
			stroke-width: 3;
		}

		/* A dashed dark fence remains distinct against the darker grass. */
		#scene-adjusted .fence {
			stroke: #503a2d;
			stroke-width: 5;
			stroke-dasharray: 8 5;
		}

		#scene-adjusted .fence-rail {
			stroke: #503a2d;
			stroke-width: 4;
		}

		#scene-adjusted .stone-walk {
			fill: #b7b9b1;
			stroke: #555a55;
			stroke-width: 2;
		}

		#scene-adjusted .stone {
			fill: #858a84;
			stroke: #555a55;
			stroke-width: 1;
		}

		#scene-adjusted .mailbox {
			fill: #47737a;
			stroke: #293f42;
			stroke-width: 2;
		}

		#scene-adjusted .mailbox-post {
			fill: #604a36;
		}

		#scene-adjusted .smoke {
			fill: #edf2ef;
			opacity: 0.72;
		}
	</style>
</head>
<body>
	<main>
		<h1>T04 – SVG House &amp; Garden</h1>
		<figure id="scene-original">
			<figcaption>Original scene</figcaption>
		<svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
			<title id="scene-title">A house and garden on a sunny day</title>
			<desc id="scene-desc">A red-roofed house with a chimney, door, and two windows sits in a green garden. A sun, cloud, tree, fence, and curved garden path complete the scene.</desc>

			<rect x="0" y="0" width="800" height="320" fill="#bfe6f2" />
			<rect x="0" y="320" width="800" height="180" fill="#91c978" />

			<circle cx="690" cy="88" r="42" fill="#ffd35a" />
			<ellipse cx="160" cy="105" rx="48" ry="25" fill="#fffdf5" />
			<circle cx="130" cy="108" r="24" fill="#fffdf5" />
			<circle cx="183" cy="91" r="30" fill="#fffdf5" />

			<rect x="90" y="250" width="24" height="92" fill="#80563a" />
			<circle cx="102" cy="218" r="54" fill="#4c9b5d" />
			<circle cx="70" cy="238" r="35" fill="#5eaa68" />
			<circle cx="132" cy="239" r="37" fill="#438d53" />

			<rect x="275" y="215" width="270" height="180" fill="#f4d7a1" stroke="#80563a" stroke-width="3" />
			<polygon points="250,220 410,105 570,220" fill="#bd5545" stroke="#804033" stroke-width="4" />
			<rect x="455" y="135" width="42" height="72" fill="#a64b3c" stroke="#804033" stroke-width="3" />

			<rect x="310" y="250" width="70" height="58" fill="#bfe6f2" stroke="#80563a" stroke-width="4" />
			<line x1="345" y1="250" x2="345" y2="308" stroke="#80563a" stroke-width="3" />
			<line x1="310" y1="279" x2="380" y2="279" stroke="#80563a" stroke-width="3" />
			<rect x="445" y="250" width="70" height="58" fill="#bfe6f2" stroke="#80563a" stroke-width="4" />
			<line x1="480" y1="250" x2="480" y2="308" stroke="#80563a" stroke-width="3" />
			<line x1="445" y1="279" x2="515" y2="279" stroke="#80563a" stroke-width="3" />

			<rect x="390" y="310" width="62" height="85" fill="#80563a" />
			<circle cx="438" cy="352" r="4" fill="#ffd35a" />

			<polyline points="35,350 35,300 75,300 75,350 115,350 115,300 155,300 155,350 195,350 195,300 235,300 235,350 275,350 275,300 315,300 315,350 355,350 355,300 395,300 395,350 435,350 435,300 475,300 475,350 515,350 515,300 555,300 555,350 595,350 595,300 635,300 635,350 675,350 675,300 715,300 715,350 765,350" fill="none" stroke="#f5f0d0" stroke-width="7" stroke-linejoin="round" />
			<line x1="25" y1="350" x2="775" y2="350" stroke="#80563a" stroke-width="5" />

			<path d="M 420 395 C 390 425, 345 445, 300 500 L 535 500 C 490 455, 455 425, 445 395 Z" fill="#d9bd8b" />
			<text x="400" y="475" text-anchor="middle" fill="#354b37" font-size="24" font-family="Georgia, 'Times New Roman', serif">Welcome to our garden</text>
		</svg>
		</figure>

		<figure id="scene-annotated-figure">
			<figcaption>Annotated scene (Step 2)</figcaption>
			<svg id="scene-annotated" viewBox="0 0 800 500" role="img" aria-labelledby="scene-annotated-title scene-annotated-desc" xmlns="http://www.w3.org/2000/svg">
				<title id="scene-annotated-title">Annotated house and garden scene</title>
				<desc id="scene-annotated-desc">The same sunny house and garden scene with callouts identifying examples of each SVG shape.</desc>

				<rect x="0" y="0" width="800" height="320" fill="#bfe6f2" />
				<rect x="0" y="320" width="800" height="180" fill="#91c978" />

				<circle cx="690" cy="88" r="42" fill="#ffd35a" />
				<ellipse cx="160" cy="105" rx="48" ry="25" fill="#fffdf5" />
				<circle cx="130" cy="108" r="24" fill="#fffdf5" />
				<circle cx="183" cy="91" r="30" fill="#fffdf5" />

				<rect x="90" y="250" width="24" height="92" fill="#80563a" />
				<circle cx="102" cy="218" r="54" fill="#4c9b5d" />
				<circle cx="70" cy="238" r="35" fill="#5eaa68" />
				<circle cx="132" cy="239" r="37" fill="#438d53" />

				<rect x="275" y="215" width="270" height="180" fill="#f4d7a1" stroke="#80563a" stroke-width="3" />
				<polygon points="250,220 410,105 570,220" fill="#bd5545" stroke="#804033" stroke-width="4" />
				<rect x="455" y="135" width="42" height="72" fill="#a64b3c" stroke="#804033" stroke-width="3" />

				<rect x="310" y="250" width="70" height="58" fill="#bfe6f2" stroke="#80563a" stroke-width="4" />
				<line x1="345" y1="250" x2="345" y2="308" stroke="#80563a" stroke-width="3" />
				<line x1="310" y1="279" x2="380" y2="279" stroke="#80563a" stroke-width="3" />
				<rect x="445" y="250" width="70" height="58" fill="#bfe6f2" stroke="#80563a" stroke-width="4" />
				<line x1="480" y1="250" x2="480" y2="308" stroke="#80563a" stroke-width="3" />
				<line x1="445" y1="279" x2="515" y2="279" stroke="#80563a" stroke-width="3" />

				<rect x="390" y="310" width="62" height="85" fill="#80563a" />
				<circle cx="438" cy="352" r="4" fill="#ffd35a" />

				<polyline points="35,350 35,300 75,300 75,350 115,350 115,300 155,300 155,350 195,350 195,300 235,300 235,350 275,350 275,300 315,300 315,350 355,350 355,300 395,300 395,350 435,350 435,300 475,300 475,350 515,350 515,300 555,300 555,350 595,350 595,300 635,300 635,350 675,350 675,300 715,300 715,350 765,350" fill="none" stroke="#f5f0d0" stroke-width="7" stroke-linejoin="round" />
				<line x1="25" y1="350" x2="775" y2="350" stroke="#80563a" stroke-width="5" />

				<path d="M 420 395 C 390 425, 345 445, 300 500 L 535 500 C 490 455, 455 425, 445 395 Z" fill="#d9bd8b" />
				<text x="400" y="475" text-anchor="middle" fill="#354b37" font-size="24" font-family="Georgia, 'Times New Roman', serif">Welcome to our garden</text>

				<g id="annotations">
					<line x1="660" y1="42" x2="660" y2="60" />
					<text x="558" y="30">circle: cx=690, cy=88, r=42</text>

					<line x1="218" y1="47" x2="186" y2="84" />
					<text x="218" y="30">
						<tspan x="218" dy="0">ellipse: cx=160, cy=105</tspan>
						<tspan x="218" dy="14">rx=48, ry=25</tspan>
					</text>

					<line x1="522" y1="112" x2="497" y2="135" />
					<text x="530" y="95">
						<tspan x="530" dy="0">rect: x=455, y=135</tspan>
						<tspan x="530" dy="14">width=42, height=72</tspan>
					</text>

					<line x1="575" y1="276" x2="345" y2="279" />
					<text x="580" y="270">
						<tspan x="580" dy="0">line: (345,250) →</tspan>
						<tspan x="580" dy="14">(345,308)</tspan>
					</text>

					<line x1="160" y1="362" x2="75" y2="350" />
					<text x="8" y="378">
						<tspan x="8" dy="0">polyline: (35,350) (35,300)</tspan>
						<tspan x="8" dy="14">(75,300) (75,350)</tspan>
					</text>

					<line x1="580" y1="225" x2="570" y2="220" />
					<text x="585" y="225">
						<tspan x="585" dy="0">polygon: (250,220)</tspan>
						<tspan x="585" dy="14">(410,105) (570,220)</tspan>
					</text>

					<line x1="560" y1="385" x2="420" y2="395" />
					<text x="560" y="398">
						<tspan x="560" dy="0">path: M 420,395 C 390,425</tspan>
						<tspan x="560" dy="14">L 535,500 C 490,455</tspan>
					</text>

					<line x1="560" y1="455" x2="400" y2="475" />
					<text x="560" y="470">text: x=400, y=475</text>
				</g>
			</svg>
		</figure>

		<figure id="scene-adjusted-figure">
			<figcaption>Adjusted scene (Step 3)</figcaption>
			<svg id="scene-adjusted" viewBox="0 0 800 500" role="img" aria-labelledby="scene-adjusted-title scene-adjusted-desc" xmlns="http://www.w3.org/2000/svg">
				<title id="scene-adjusted-title">Adjusted house and garden scene</title>
				<desc id="scene-adjusted-desc">A rebalanced house and tree with improved contrast, a dashed fence, a curved stone path, a mailbox, and chimney smoke.</desc>

				<rect x="0" y="0" width="800" height="320" fill="#bfe6f2" />
				<rect class="ground" x="0" y="320" width="800" height="180" fill="#91c978" />

				<circle cx="690" cy="88" r="42" fill="#ffd35a" />
				<ellipse cx="160" cy="105" rx="48" ry="25" fill="#fffdf5" />
				<circle cx="130" cy="108" r="24" fill="#fffdf5" />
				<circle cx="183" cy="91" r="30" fill="#fffdf5" />

				<!-- Shift the tree and house slightly toward each other. -->
				<g transform="translate(8, 0)">
					<rect x="90" y="250" width="24" height="92" fill="#80563a" />
					<circle cx="102" cy="218" r="54" fill="#4c9b5d" />
					<circle cx="70" cy="238" r="35" fill="#5eaa68" />
					<circle cx="132" cy="239" r="37" fill="#438d53" />
				</g>

				<g transform="translate(-8, 0)">
					<rect class="house-body" x="275" y="215" width="270" height="180" fill="#f4d7a1" stroke="#80563a" stroke-width="3" />
					<polygon class="roof" points="250,220 410,105 570,220" fill="#bd5545" stroke="#804033" stroke-width="4" />
					<rect class="chimney" x="455" y="135" width="42" height="72" fill="#a64b3c" stroke="#804033" stroke-width="3" />
					<!-- Light ellipses make a subtle plume above the chimney. -->
					<ellipse class="smoke" cx="478" cy="131" rx="10" ry="6" />
					<ellipse class="smoke" cx="489" cy="115" rx="13" ry="7" />
					<ellipse class="smoke" cx="503" cy="99" rx="16" ry="8" />

					<rect class="window-frame" x="310" y="250" width="70" height="58" fill="#bfe6f2" stroke="#80563a" stroke-width="4" />
					<line class="window-divider" x1="345" y1="250" x2="345" y2="308" stroke="#80563a" stroke-width="3" />
					<line class="window-divider" x1="310" y1="279" x2="380" y2="279" stroke="#80563a" stroke-width="3" />
					<rect class="window-frame" x="445" y="250" width="70" height="58" fill="#bfe6f2" stroke="#80563a" stroke-width="4" />
					<line class="window-divider" x1="480" y1="250" x2="480" y2="308" stroke="#80563a" stroke-width="3" />
					<line class="window-divider" x1="445" y1="279" x2="515" y2="279" stroke="#80563a" stroke-width="3" />

					 <!-- My edit: changed the door to dark green. -->
			        <rect x="390" y="310" width="62" height="85" fill="#2e5e4e" />
					<circle cx="438" cy="352" r="4" fill="#ffd35a" />
				</g>

				<polyline class="fence" points="35,350 35,300 75,300 75,350 115,350 115,300 155,300 155,350 195,350 195,300 235,300 235,350 275,350 275,300 315,300 315,350 355,350 355,300 395,300 395,350 435,350 435,300 475,300 475,350 515,350 515,300 555,300 555,350 595,350 595,300 635,300 635,350 675,350 675,300 715,300 715,350 765,350" fill="none" stroke="#f5f0d0" stroke-width="7" stroke-linejoin="round" />
				<line class="fence-rail" x1="25" y1="350" x2="775" y2="350" stroke="#80563a" stroke-width="5" />

				<path d="M 420 395 C 390 425, 345 445, 300 500 L 535 500 C 490 455, 455 425, 445 395 Z" fill="#d9bd8b" />
				<!-- Add a curved stone walk from the shifted door into the garden. -->
				<path class="stone-walk" d="M 406 395 C 404 425, 380 450, 370 500 L 440 500 C 432 455, 421 425, 420 395 Z" />
				<ellipse class="stone" cx="412" cy="407" rx="7" ry="4" />
				<ellipse class="stone" cx="408" cy="426" rx="8" ry="5" />
				<ellipse class="stone" cx="404" cy="446" rx="8" ry="5" />
				<ellipse class="stone" cx="404" cy="467" rx="9" ry="5" />
				<ellipse class="stone" cx="405" cy="488" rx="9" ry="5" />

				<!-- Place the mailbox beside the walk, clear of the house. -->
				<rect class="mailbox-post" x="566" y="425" width="8" height="50" />
				<rect class="mailbox" x="548" y="397" width="48" height="29" rx="2" />
				<polygon class="mailbox" points="548,397 572,382 596,397" />

				<text x="400" y="475" text-anchor="middle" fill="#354b37" font-size="24" font-family="Georgia, 'Times New Roman', serif">Welcome to our garden</text>
			</svg>
		</figure>
	</main>
</body>
</html>
